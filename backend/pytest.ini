[pytest]
# This root-level pytest.ini covers ONLY tests/e2e/ -- per-service tests
# each run in their own directory with their own PYTHONPATH (see each
# service's tests/README or the top-level README's "Running tests" section)
# to avoid multiple services' same-named `app` package colliding in one
# session. Running bare `pytest` from the repo root only discovers this
# marker registration and tests/e2e/, which self-skips when the
# docker-compose stack isn't up (see tests/e2e/conftest.py).
markers =
    e2e: end-to-end tests that require the full docker-compose stack running (see tests/e2e/conftest.py)
asyncio_mode = auto
